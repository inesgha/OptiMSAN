# Alternative à XAMPP : base MariaDB dans Docker (même version que XAMPP 8.2).
# Lancement : docker compose up -d
# DATABASE_URL à utiliser dans .env.local :
#   mysql://app:app@127.0.0.1:3306/optimsan?serverVersion=10.4.32-MariaDB&charset=utf8mb4
services:
###> doctrine/doctrine-bundle ###
  database:
    image: mariadb:${MARIADB_VERSION:-10.4}
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-optimsan}
      # Mots de passe de développement uniquement : à changer en production
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-app}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MARIADB_ROOT_PASSWORD} --silent"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
